<!doctype html>
<!--
  PROTOTYPE — NOT FOR PUBLICATION.
  No visible text lives in this file: every string comes from /i18n/<lang>.json
  through data-i18n (text) and data-i18n-attr (attributes).
  The data-* defaults on <html> are overwritten by config.js at load.
-->
<html lang="en" class="i18n-pending" data-theme="craie-cave" data-fonts="pair-a" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="meta.title"></title>
  <meta name="description" content="" data-i18n-attr="content:meta.description">

  <!-- Japanese fallback only. The Latin review fonts are bundled: see css/fonts.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&family=Noto+Serif+JP:wght@400;600&display=swap">

  <!-- 3D test (js/bottle-3d.js). This only says where Three.js lives, pinned to one
       version; nothing is downloaded until a 3D stage scrolls into view. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/components.css">
  <noscript><style>html.i18n-pending body { visibility: visible; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <p class="proto-badge" data-i18n="proto.badge"></p>

  <header class="site-header">
    <a class="brand" href="index.html" data-i18n-attr="aria-label:brand.home">
      <img class="brand__logo" src="assets/logo-placeholder.svg" width="200" height="56" alt="">
      <span class="brand__name" data-i18n="brand.name"></span>
    </a>
    <nav class="site-nav" data-i18n-attr="aria-label:a11y.mainNav">
      <a href="#cuvees" data-i18n="nav.cuvees"></a>
      <a href="#maison" data-i18n="nav.house"></a>
    </nav>
    <div class="lang" role="group" data-lang-switcher data-i18n-attr="aria-label:a11y.langSwitcher"></div>
  </header>

  <!-- I · II · III · IV in the margin (wide screens). Links are added by main.js. -->
  <nav class="cuvee-index" data-cuvee-index data-i18n-attr="aria-label:nav.cuvees"></nav>

  <main id="main">

    <section class="hero" aria-labelledby="hero-title" data-checkpoint="nav.top">
      <canvas class="hero__bubbles" data-bubbles aria-hidden="true"></canvas>

      <div class="hero__copy">
        <p class="label hero__label" data-i18n="hero.label"></p>
        <h1 class="hero__title" id="hero-title" data-i18n="hero.title"></h1>
        <p class="hero__lede" data-i18n="hero.lede"></p>
        <div class="hero__actions">
          <a class="btn btn--primary" href="#cuvees" data-i18n="hero.ctaPrimary"></a>
          <a class="btn btn--ghost" href="#maison" data-i18n="hero.ctaSecondary"></a>
        </div>
      </div>

      <figure class="plate hero__plate">
        <div class="plate__frame">
          <img class="plate__img hero__bottle" src="assets/placeholder-bottle.svg" width="400" height="1000" alt="" data-i18n-attr="alt:hero.imgAlt">
        </div>
        <figcaption class="plate__caption" data-i18n="hero.caption"></figcaption>
      </figure>
    </section>

    <div class="cuvees" id="cuvees" data-cuvees></div>

    <!--
      One copy per entry of SITE_CONFIG.CUVEES, cloned by main.js.
      "{i}" becomes the cuvée's position in the "cuvees" array of the i18n files.
    -->
    <template id="cuvee-template">
      <section class="cuvee" data-settle data-checkpoint="cuvees.{i}.name">
        <div class="sunburst" data-reveal aria-hidden="true"></div>

        <!-- On phones each of the two "screens" below fills the display and the scroll
             locks onto it. On desktop they dissolve (display: contents) into one grid. -->
        <div class="cuvee__screen cuvee__screen--bottle" data-settle>
        <header class="cuvee__head" data-reveal>
          <p class="cuvee__numeral" aria-hidden="true"></p>
          <p class="label cuvee__meta" data-i18n="cuvees.{i}.meta"></p>
          <h2 class="cuvee__name" data-i18n="cuvees.{i}.name"></h2>
        </header>

        <figure class="plate cuvee__plate" data-reveal>
          <div class="plate__frame">
            <img class="plate__img" src="assets/placeholder-bottle.svg" width="400" height="1000" loading="lazy" alt="" data-i18n-attr="alt:cuvees.{i}.alt">
            <!-- Reserved for the future 3D bottle. Stays empty in this prototype. -->
            <div class="bottle-stage" data-cuvee="" aria-hidden="true"></div>
          </div>
          <figcaption class="plate__caption" data-i18n="cuvees.{i}.caption"></figcaption>
        </figure>
        </div>

        <div class="cuvee__screen cuvee__screen--info" data-settle>
        <p class="cuvee__lead" data-reveal data-i18n="cuvees.{i}.lead"></p>

        <div class="cuvee__card" data-reveal>
          <dl class="spec">
            <div class="spec__row">
              <dt class="label" data-i18n="cuvee.typeLabel"></dt>
              <dd data-i18n="cuvees.{i}.type"></dd>
            </div>
            <div class="spec__row">
              <dt class="label" data-i18n="cuvee.blendLabel"></dt>
              <dd data-i18n="cuvees.{i}.blend"></dd>
            </div>
            <div class="spec__row">
              <dt class="label" data-i18n="cuvee.notesLabel"></dt>
              <dd data-i18n="cuvees.{i}.notes"></dd>
            </div>
            <div class="spec__row spec__row--price">
              <dt class="label" data-i18n="cuvee.priceLabel"></dt>
              <dd data-i18n="cuvees.{i}.price"></dd>
            </div>
          </dl>
          <a class="btn btn--primary cuvee__buy" data-shop href="#" data-i18n="cuvees.{i}.buy"></a>
        </div>
        </div>
      </section>
    </template>

    <section class="house" id="maison" aria-labelledby="house-title" data-checkpoint="nav.house">
      <h2 class="house__title" id="house-title" data-reveal data-i18n="house.title"></h2>
      <p class="house__body" data-reveal data-i18n="house.body"></p>
      <dl class="ledger" data-reveal>
        <div class="ledger__row">
          <dt class="label" data-i18n="house.facts.0.term"></dt>
          <dd data-i18n="house.facts.0.value"></dd>
        </div>
        <div class="ledger__row">
          <dt class="label" data-i18n="house.facts.1.term"></dt>
          <dd data-i18n="house.facts.1.value"></dd>
        </div>
        <div class="ledger__row">
          <dt class="label" data-i18n="house.facts.2.term"></dt>
          <dd data-i18n="house.facts.2.value"></dd>
        </div>
        <div class="ledger__row">
          <dt class="label" data-i18n="house.facts.3.term"></dt>
          <dd data-i18n="house.facts.3.value"></dd>
        </div>
      </dl>
    </section>

  </main>

  <footer class="site-footer">
    <p class="site-footer__brand" data-i18n="brand.name"></p>
    <nav class="site-footer__legal" data-i18n-attr="aria-label:a11y.legalNav">
      <a href="#" data-i18n="footer.mentions"></a>
      <a href="#" data-i18n="footer.cgv"></a>
      <a href="#" data-i18n="footer.privacy"></a>
      <a href="#" data-i18n="footer.cookies"></a>
    </nav>
    <p class="label site-footer__label" data-i18n="footer.label"></p>
    <p class="site-footer__health" data-i18n="footer.health"></p>
    <p class="label site-footer__copyright" data-i18n="footer.copyright"></p>
  </footer>

  <!-- Mobile only: follows the cuvée currently on screen. -->
  <a class="buybar" data-buybar href="#" hidden>
    <span class="buybar__label"></span>
    <span class="buybar__price"></span>
  </a>

  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/age-gate.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/bottle-3d.js"></script>
  <script src="js/main.js"></script>
  <script src="js/extras.js"></script>
  <!-- TESTING ONLY — delete this line before launch -->
  <script src="js/testing-panel.js"></script>
</body>
</html>
