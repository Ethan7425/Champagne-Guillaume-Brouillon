<!doctype html>
<!--
  PROTOTYPE — NOT FOR PUBLICATION.
  TEST PAGE: the four bottles in a ring. Pick one, then scroll: the chosen bottle stays
  on screen while its sheet, two close-ups and a row of photographs go by.
  The home page (index.html) is unchanged; this page is reached from the test panel.
  All text comes from /i18n. "{i}" in data-ring-key / data-ring-attr is replaced by the
  position of the selected cuvée (js/bottle-ring.js).
-->
<html lang="en" class="i18n-pending" data-theme="craie-cave" data-fonts="pair-a" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="meta.titleRing"></title>

  <!-- Japanese fallback only. The Latin review fonts are bundled: see css/fonts.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&family=Noto+Serif+JP:wght@400;600&display=swap">

  <!-- Where Three.js lives, pinned to one version (see js/bottle-3d.js). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/components.css">
  <noscript><style>html.i18n-pending body { visibility: visible; }</style></noscript>
</head>
<body class="page-ring">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <p class="proto-badge" data-i18n="proto.badge"></p>

  <header class="site-header">
    <a class="brand" href="index.html" data-i18n-attr="aria-label:brand.home">
      <img class="brand__logo" src="assets/logo-placeholder.svg" width="200" height="56" alt="">
      <span class="brand__name" data-i18n="brand.name"></span>
    </a>
    <nav class="site-nav" data-i18n-attr="aria-label:a11y.mainNav">
      <a href="index.html?all=1#cuvees" data-i18n="nav.cuvees"></a>
      <a href="index.html?all=1#maison" data-i18n="nav.house"></a>
    </nav>
    <div class="lang" role="group" data-lang-switcher data-i18n-attr="aria-label:a11y.langSwitcher"></div>
  </header>

  <main id="main">

    <!--
      The stage is pinned: the bottles stay on screen while the four "screens"
      below scroll over them. Scrolling moves the camera, not the page furniture:
      01 the ring · 02 the chosen cuvée · 03 and 04 close-ups of the bottle.
    -->
    <div class="voyage" data-ring>
      <div class="voyage__stage" data-ring-stage>
        <!-- Fallback when 3D cannot run (no WebGL, reduced motion, double-click). -->
        <img class="ring__fallback" src="assets/placeholder-bottle.svg" width="400" height="1000" alt="" data-ring-attr="alt:cuvees.{i}.alt">
      </div>

      <!-- 01 · the ring -->
      <section class="voyage__screen voyage__screen--ring" id="selection" data-ring-screen data-checkpoint="ring.navSelect" aria-labelledby="ring-name">
        <!-- I · II · III · IV, with the name of the one in front (buttons added by bottle-ring.js) -->
        <div class="ring__switch" role="group" data-ring-picker data-i18n-attr="aria-label:ring.pick"></div>

        <div class="ring__title">
          <p class="label" data-i18n="ring.kicker"></p>
          <div class="ring__name-row">
            <button type="button" class="ring__arrow" data-ring-prev data-i18n-attr="aria-label:ring.prev">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12H4m6-6-6 6 6 6"/></svg>
            </button>
            <h1 class="ring__name" id="ring-name" aria-live="polite" data-ring-key="cuvees.{i}.name"></h1>
            <button type="button" class="ring__arrow" data-ring-next data-i18n-attr="aria-label:ring.next">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
            </button>
          </div>
          <ul class="ring__tags">
            <li class="label" data-ring-key="cuvees.{i}.tags.0"></li>
            <li class="label" data-ring-key="cuvees.{i}.tags.1"></li>
            <li class="label" data-ring-key="cuvees.{i}.tags.2"></li>
          </ul>
        </div>
      </section>

      <!-- 02 · the chosen cuvée: the bottle slides aside, its sheet comes in -->
      <section class="voyage__screen voyage__screen--text" id="details" data-settle data-ring-screen data-checkpoint="ring.navSheet" aria-labelledby="details-name">
        <div class="voyage__text">
          <p class="label" data-i18n="ring.kicker"></p>
          <h2 class="voyage__title" id="details-name" data-ring-key="cuvees.{i}.name"></h2>
          <dl class="notes">
            <div class="notes__row">
              <dt class="label" data-i18n="cuvee.typeLabel"></dt>
              <dd class="label" data-ring-key="cuvees.{i}.type"></dd>
            </div>
            <div class="notes__row">
              <dt class="label" data-i18n="cuvee.blendLabel"></dt>
              <dd class="label" data-ring-key="cuvees.{i}.blend"></dd>
            </div>
            <div class="notes__row">
              <dt class="label" data-i18n="cuvee.notesLabel"></dt>
              <dd class="label" data-ring-key="cuvees.{i}.notes"></dd>
            </div>
          </dl>
          <p class="voyage__body" data-ring-key="cuvees.{i}.lead"></p>
          <div class="voyage__buy">
            <p class="voyage__price" data-ring-key="cuvees.{i}.price"></p>
            <a class="btn btn--primary" href="#" data-ring-shop data-ring-key="cuvees.{i}.buy"></a>
          </div>
        </div>
      </section>

      <!-- 03 · close-up: the top of the bottle -->
      <section class="voyage__screen voyage__screen--text" id="coiffe" data-settle data-ring-screen data-checkpoint="ring.closeups.0.title" aria-labelledby="closeup-a">
        <div class="voyage__text">
          <p class="label" data-i18n="ring.bottle"></p>
          <h2 class="voyage__title" id="closeup-a" data-i18n="ring.closeups.0.title"></h2>
          <p class="voyage__body" data-i18n="ring.closeups.0.body"></p>
        </div>
      </section>

      <!-- 04 · close-up: the label -->
      <section class="voyage__screen voyage__screen--text" id="etiquette" data-settle data-ring-screen data-checkpoint="ring.closeups.1.title" aria-labelledby="closeup-b">
        <div class="voyage__text">
          <p class="label" data-i18n="ring.bottle"></p>
          <h2 class="voyage__title" id="closeup-b" data-i18n="ring.closeups.1.title"></h2>
          <p class="voyage__body" data-i18n="ring.closeups.1.body"></p>
        </div>
      </section>
    </div>

    <!-- The chosen cuvée in the glass (feature "glass"): a flute drawn in line, with rising bubbles -->
    <section class="glass" id="verre" data-settle data-checkpoint="glass.title" aria-labelledby="glass-title">
      <div class="glass__figures">
        <canvas class="glass__canvas" data-glass-canvas aria-hidden="true"></canvas>
        <!-- Aroma chart (feature "chart"), drawn by extras.js from config.js -->
        <figure class="aroma">
          <svg class="aroma__chart" data-aroma-chart viewBox="-150 -118 300 236" role="img" data-i18n-attr="aria-label:glass.chartNote"></svg>
          <figcaption class="plate__caption" data-i18n="glass.chartNote"></figcaption>
        </figure>
      </div>
      <div class="glass__text">
        <p class="label" data-ring-key="cuvees.{i}.name"></p>
        <h2 class="voyage__title" id="glass-title" data-i18n="glass.title"></h2>
        <ul class="glass__tags">
          <li data-ring-key="cuvees.{i}.tags.0"></li>
          <li data-ring-key="cuvees.{i}.tags.1"></li>
          <li data-ring-key="cuvees.{i}.tags.2"></li>
        </ul>
        <dl class="notes">
          <div class="notes__row">
            <dt class="label" data-i18n="glass.serviceLabel"></dt>
            <dd class="label" data-i18n="glass.service"></dd>
          </div>
          <div class="notes__row">
            <dt class="label" data-i18n="glass.glassLabel"></dt>
            <dd class="label" data-i18n="glass.glass"></dd>
          </div>
          <div class="notes__row">
            <dt class="label" data-i18n="glass.pairLabel"></dt>
            <dd class="label" data-i18n="glass.pair"></dd>
          </div>
        </dl>
      </div>
    </section>

    <!-- 05 · photographs for the chosen cuvée: a row of tall plates (placeholders) -->
    <section class="ring-photos" id="planches" data-settle data-checkpoint="ring.photosTitle" aria-labelledby="photos-title">
      <header class="ring-photos__head">
        <div>
          <p class="label" data-ring-key="cuvees.{i}.name"></p>
          <h2 class="voyage__title" id="photos-title" data-i18n="ring.photosTitle"></h2>
        </div>
        <div class="ring-photos__arrows">
          <button type="button" class="ring__arrow" data-photo-prev data-i18n-attr="aria-label:ring.photosPrev">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12H4m6-6-6 6 6 6"/></svg>
          </button>
          <button type="button" class="ring__arrow" data-photo-next data-i18n-attr="aria-label:ring.photosNext">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
          </button>
        </div>
      </header>

      <div class="photo-strip" data-photo-strip tabindex="0" data-i18n-attr="aria-label:ring.photosTitle">
        <figure class="photo">
          <div class="photo__frame">
            <img src="assets/placeholder-photo.svg" width="1200" height="900" loading="lazy" alt="" data-i18n-attr="alt:ring.photos.0.alt">
          </div>
          <figcaption class="plate__caption" data-i18n="ring.photos.0.caption"></figcaption>
        </figure>
        <figure class="photo">
          <div class="photo__frame">
            <img src="assets/placeholder-photo.svg" width="1200" height="900" loading="lazy" alt="" data-i18n-attr="alt:ring.photos.1.alt">
          </div>
          <figcaption class="plate__caption" data-i18n="ring.photos.1.caption"></figcaption>
        </figure>
        <figure class="photo">
          <div class="photo__frame">
            <img src="assets/placeholder-photo.svg" width="1200" height="900" loading="lazy" alt="" data-i18n-attr="alt:ring.photos.2.alt">
          </div>
          <figcaption class="plate__caption" data-i18n="ring.photos.2.caption"></figcaption>
        </figure>
        <figure class="photo">
          <div class="photo__frame">
            <img src="assets/placeholder-photo.svg" width="1200" height="900" loading="lazy" alt="" data-i18n-attr="alt:ring.photos.3.alt">
          </div>
          <figcaption class="plate__caption" data-i18n="ring.photos.3.caption"></figcaption>
        </figure>
        <figure class="photo">
          <div class="photo__frame">
            <img src="assets/placeholder-photo.svg" width="1200" height="900" loading="lazy" alt="" data-i18n-attr="alt:ring.photos.4.alt">
          </div>
          <figcaption class="plate__caption" data-i18n="ring.photos.4.caption"></figcaption>
        </figure>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p class="site-footer__brand" data-i18n="brand.name"></p>
    <nav class="site-footer__legal" data-i18n-attr="aria-label:a11y.legalNav">
      <a href="#" data-i18n="footer.mentions"></a>
      <a href="#" data-i18n="footer.cgv"></a>
      <a href="#" data-i18n="footer.privacy"></a>
      <a href="#" data-i18n="footer.cookies"></a>
    </nav>
    <p class="label site-footer__label" data-i18n="footer.label"></p>
    <p class="site-footer__health" data-i18n="footer.health"></p>
    <p class="label site-footer__copyright" data-i18n="footer.copyright"></p>
  </footer>

  <!-- Mobile only: order the cuvée currently in front of the ring. -->
  <a class="buybar" data-ring-buybar data-ring-shop href="#">
    <span class="buybar__label" data-ring-key="cuvees.{i}.buy"></span>
    <span class="buybar__price" data-ring-key="cuvees.{i}.price"></span>
  </a>

  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/age-gate.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/bottle-3d.js"></script>
  <script src="js/bottle-ring.js"></script>
  <script src="js/main.js"></script>
  <script src="js/extras.js"></script>
  <!-- TESTING ONLY — delete this line before launch -->
  <script src="js/testing-panel.js"></script>
</body>
</html>
