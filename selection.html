<!doctype html>
<!--
  PROTOTYPE — NOT FOR PUBLICATION.
  TEST PAGE: the four bottles in a ring. Pick one, then scroll down for its details.
  The home page (index.html) is unchanged; this page is reached from the test panel.
  All text comes from /i18n. "{i}" in data-ring-key / data-ring-attr is replaced by the
  position of the selected cuvée (js/bottle-ring.js).
-->
<html lang="en" class="i18n-pending" data-theme="craie-cave" data-fonts="pair-a" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="meta.titleRing"></title>

  <!-- Japanese fallback only. The Latin review fonts are bundled: see css/fonts.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&family=Noto+Serif+JP:wght@400;600&display=swap">

  <!-- Where Three.js lives, pinned to one version (see js/bottle-3d.js). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/components.css">
  <noscript><style>html.i18n-pending body { visibility: visible; }</style></noscript>
</head>
<body class="page-ring">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <p class="proto-badge" data-i18n="proto.badge"></p>

  <header class="site-header">
    <a class="brand" href="index.html" data-i18n-attr="aria-label:brand.home">
      <img class="brand__logo" src="assets/logo-placeholder.svg" width="200" height="56" alt="">
      <span class="brand__name" data-i18n="brand.name"></span>
    </a>
    <nav class="site-nav" data-i18n-attr="aria-label:a11y.mainNav">
      <a href="index.html#cuvees" data-i18n="nav.cuvees"></a>
      <a href="index.html#maison" data-i18n="nav.house"></a>
    </nav>
    <div class="lang" role="group" data-lang-switcher data-i18n-attr="aria-label:a11y.langSwitcher"></div>
  </header>

  <main id="main">

    <section class="ring" data-ring aria-labelledby="ring-name">
      <div class="ring__copy">
        <p class="label" data-i18n="ring.label"></p>
        <p class="ring__numeral" aria-hidden="true" data-ring-numeral></p>
        <p class="label ring__meta" data-ring-key="cuvees.{i}.meta"></p>
        <h1 class="ring__name" id="ring-name" aria-live="polite" data-ring-key="cuvees.{i}.name"></h1>
        <p class="ring__hint" data-i18n="ring.hint"></p>

        <div class="ring__controls">
          <button type="button" class="ring__arrow" data-ring-prev data-i18n-attr="aria-label:ring.prev">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
          </button>
          <!-- I · II · III · IV buttons are added by bottle-ring.js -->
          <div class="ring__picker" role="group" data-ring-picker data-i18n-attr="aria-label:ring.pick"></div>
          <button type="button" class="ring__arrow" data-ring-next data-i18n-attr="aria-label:ring.next">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
          </button>
        </div>

        <a class="btn btn--primary" href="#details" data-i18n="ring.details"></a>
      </div>

      <!-- The 3D canvas is added here. The image is the fallback (no WebGL, reduced motion, double-click). -->
      <div class="ring__stage" data-ring-stage>
        <img class="ring__fallback" src="assets/placeholder-bottle.svg" width="400" height="1000" alt="" data-ring-attr="alt:cuvees.{i}.alt">
      </div>
    </section>

    <section class="ring-details" id="details" data-settle aria-labelledby="details-name">
      <header class="ring-details__head">
        <p class="label ring__meta" data-ring-key="cuvees.{i}.meta"></p>
        <h2 class="ring-details__name" id="details-name" data-ring-key="cuvees.{i}.name"></h2>
      </header>

      <p class="cuvee__lead" data-ring-key="cuvees.{i}.lead"></p>

      <div class="cuvee__card">
        <dl class="spec">
          <div class="spec__row">
            <dt class="label" data-i18n="cuvee.typeLabel"></dt>
            <dd data-ring-key="cuvees.{i}.type"></dd>
          </div>
          <div class="spec__row">
            <dt class="label" data-i18n="cuvee.blendLabel"></dt>
            <dd data-ring-key="cuvees.{i}.blend"></dd>
          </div>
          <div class="spec__row">
            <dt class="label" data-i18n="cuvee.notesLabel"></dt>
            <dd data-ring-key="cuvees.{i}.notes"></dd>
          </div>
          <div class="spec__row spec__row--price">
            <dt class="label" data-i18n="cuvee.priceLabel"></dt>
            <dd data-ring-key="cuvees.{i}.price"></dd>
          </div>
        </dl>
        <a class="btn btn--primary cuvee__buy" href="#" data-ring-shop data-ring-key="cuvees.{i}.buy"></a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p class="site-footer__brand" data-i18n="brand.name"></p>
    <nav class="site-footer__legal" data-i18n-attr="aria-label:a11y.legalNav">
      <a href="#" data-i18n="footer.mentions"></a>
      <a href="#" data-i18n="footer.cgv"></a>
      <a href="#" data-i18n="footer.privacy"></a>
      <a href="#" data-i18n="footer.cookies"></a>
    </nav>
    <p class="label site-footer__label" data-i18n="footer.label"></p>
    <p class="site-footer__health" data-i18n="footer.health"></p>
    <p class="label site-footer__copyright" data-i18n="footer.copyright"></p>
  </footer>

  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/age-gate.js"></script>
  <script src="js/bottle-3d.js"></script>
  <script src="js/bottle-ring.js"></script>
  <script src="js/main.js"></script>
  <!-- TESTING ONLY — delete this line before launch -->
  <script src="js/testing-panel.js"></script>
</body>
</html>
