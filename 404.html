<!doctype html>
<!-- PROTOTYPE — NOT FOR PUBLICATION. Same shell as index.html; all text comes from /i18n. -->
<html lang="en" class="i18n-pending" data-theme="craie-cave" data-fonts="pair-a" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="meta.title404"></title>

  <!-- Japanese fallback only. The Latin review fonts are bundled: see css/fonts.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&family=Noto+Serif+JP:wght@400;600&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/components.css">
  <noscript><style>html.i18n-pending body { visibility: visible; }</style></noscript>
</head>
<body class="page-404">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <p class="proto-badge" data-i18n="proto.badge"></p>

  <header class="site-header">
    <a class="brand" href="index.html" data-i18n-attr="aria-label:brand.home">
      <img class="brand__logo" src="assets/logo-placeholder.svg" width="200" height="56" alt="">
      <span class="brand__name" data-i18n="brand.name"></span>
    </a>
    <div class="lang" role="group" data-lang-switcher data-i18n-attr="aria-label:a11y.langSwitcher"></div>
  </header>

  <main id="main">
    <section class="notfound" aria-labelledby="notfound-title">
      <p class="label" data-i18n="notfound.code"></p>
      <h1 class="notfound__title" id="notfound-title" data-i18n="notfound.title"></h1>
      <p class="notfound__body" data-i18n="notfound.body"></p>
      <a class="btn btn--primary" href="index.html" data-i18n="notfound.cta"></a>
    </section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__brand" data-i18n="brand.name"></p>
    <nav class="site-footer__legal" data-i18n-attr="aria-label:a11y.legalNav">
      <a href="#" data-i18n="footer.mentions"></a>
      <a href="#" data-i18n="footer.cgv"></a>
      <a href="#" data-i18n="footer.privacy"></a>
      <a href="#" data-i18n="footer.cookies"></a>
    </nav>
    <p class="label site-footer__label" data-i18n="footer.label"></p>
    <p class="site-footer__health" data-i18n="footer.health"></p>
    <p class="label site-footer__copyright" data-i18n="footer.copyright"></p>
  </footer>

  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/age-gate.js"></script>
  <script src="js/main.js"></script>
  <!-- TESTING ONLY — delete this line before launch -->
  <script src="js/testing-panel.js"></script>
</body>
</html>
